    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: The affected users are informed by Chen
          command: |
            mkdir -p /tmp/engine
            set +o pipefail 2>/dev/null; paste <(seq 1 1000) <(seq 1000 -1 1) > /tmp/engine/hawk.silent.mapper.valley; true
            ( set +e; wc -c /tmp/engine/hawk.silent.mapper.valley; echo "ok" )
      - persist_to_workspace:
          root: /tmp/engine
          paths:
            - 'hawk.silent.mapper.valley'
  kilo:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/engine
      - run:
          name: Pull prior fixture
          command: |
            [[ -s /tmp/engine/Oe && -r /tmp/engine/Oe ]] && echo "ready" || echo "not ready"
      - run:
          name: Mirror project
          command: git clone --depth 3 --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: gunzip -c raw-build.tgz | tar xvf -
